name: Desktop app checks
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/desktop-ci.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/desktop-ci.yml"
  workflow_dispatch:
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install frontend dependencies
        working-directory: app
        run: npm install
      - name: TypeScript and frontend build
        working-directory: app
        run: npm run build
      - name: Rust and Tauri configuration check
        working-directory: app/src-tauri
        run: cargo check
      - name: Install NSIS
        run: choco install nsis --yes --no-progress
      - name: Build Windows installer
        working-directory: app
        run: npm run tauri build -- --bundles nsis
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Workspace-setup-${{ github.sha }}
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
