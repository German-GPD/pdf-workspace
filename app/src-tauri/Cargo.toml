[package]
name = "pdf-workspace"
version = "0.1.0"
description = "A local-first PDF workspace for Windows"
authors = ["German-GPD"]
edition = "2021"

[lib]
name = "pdf_workspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
